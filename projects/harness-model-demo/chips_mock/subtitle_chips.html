<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f3f4f6;padding:40px;margin:0}
  .card{background:#fff;border-radius:16px;padding:28px 32px;max-width:920px;margin:0 auto;
        box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .title{font-size:22px;font-weight:700;margin:0 0 12px}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;color:#6b7280;font-size:13.5px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border-radius:999px;
        background:#f3f4f6;border:1px solid #e5e7eb;color:#111827;font-weight:500;font-size:13px}
  .chip img,.chip .ico{width:18px;height:18px;border-radius:4px;display:block}
  .dot{color:#d1d5db;font-weight:400}
  .note{margin-top:18px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<div class="card">
  <div class="title">Skill Effectiveness on SWE-Together</div>
  <div class="meta">
    <span class="chip">
      <!-- Codex-style mark (placeholder geometric) -->
      <svg class="ico" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><rect width="18" height="18" rx="4" fill="#111827"/><path d="M5 9h8M9 5v8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      Codex CLI
    </span>
    <span class="dot">·</span>
    <span class="chip">
      <!-- OpenAI-ish mark placeholder -->
      <svg class="ico" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><rect width="18" height="18" rx="4" fill="#10a37f"/><circle cx="9" cy="9" r="4.2" fill="none" stroke="#fff" stroke-width="1.6"/></svg>
      GPT-6 Luna
    </span>
    <span class="dot">·</span>
    <span>SWE-Together</span>
    <span class="dot">·</span>
    <span>k = 2 replicates</span>
  </div>
  <div class="note">Mock only — icons are placeholders; swap for real Codex / model brand assets.</div>
</div>
</body>
</html>
